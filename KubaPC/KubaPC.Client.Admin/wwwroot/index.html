<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#272251" />
    <title>KubaPC Admin</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="_content/KubaPC.SharedClient.Components/css/kuba.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script type="importmap"></script>
</head>
<body>
    <div id="app">
        <div class="kuba-splash" role="status" aria-label="Loading KubaPC">
            <svg class="kuba-splash-ring" viewBox="0 0 100 100" aria-hidden="true"><circle r="40" cx="50" cy="50" /><circle r="40" cx="50" cy="50" /></svg>
            <svg class="kuba-splash-mark" viewBox="0 0 100 100" aria-hidden="true"><path pathLength="1" d="M50 2 A48 48 0 0 0 50 98 Z" /><path pathLength="1" d="M54.2 50 L85.98 18.22 A48 48 0 0 1 85.98 81.78 Z" /></svg>
        </div>
    </div>
    <div id="blazor-error-ui">
        Something went wrong. <a href="." class="reload">Reload</a> <span class="dismiss">×</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_content/KubaPC.SharedClient.Components/lib/gsap/gsap.min.js"></script>
    <script src="_content/KubaPC.SharedClient.Components/lib/gsap/ScrollTrigger.min.js"></script>
    <script src="_content/KubaPC.SharedClient.Components/js/kuba-motion.js"></script>
</body>
</html>
