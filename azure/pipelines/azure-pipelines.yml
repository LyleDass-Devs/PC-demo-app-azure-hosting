trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

parameters:
  # During the week the pipeline runs many times against test; prod must not sit waiting
  # for approval on each run. On the interview morning, start the run manually with this ticked.
  - name: deployProd
    displayName: Deploy prod
    type: boolean
    default: false

variables:
  - name: agentPool
    value: vnet-agents
  - name: location
    value: southafricanorth
  - name: appSolution
    value: KubaPC/KubaPC.slnx
  - name: apiProject
    value: KubaPC/KubaPC.API/KubaPC.API.csproj
  - name: adminProject
    value: KubaPC/KubaPC.Client.Admin/KubaPC.Client.Admin.csproj
  - name: testProject
    value: KubaPC/KubaPC.Services.Tests/KubaPC.Services.Tests.csproj
  - name: sqlScripts
    value: KubaPC/KubaPC.Database/Scripts

stages:
  - stage: Validate
    displayName: Validate infrastructure
    jobs:
      - job: Lint
        displayName: Compile and lint the Bicep
        pool:
          name: $(agentPool)
        steps:
          - checkout: self
          - script: |
              set -euo pipefail
              for template in azure/infra/main.bicep azure/infra/shared/main.bicep; do
                az bicep build --file "$template" --stdout > /dev/null
                az bicep lint --file "$template"
                echo "Compiles and lints clean: $template"
              done
            displayName: Compile and lint
      - job: WhatIfTest
        displayName: Preview changes to test
        dependsOn: Lint
        pool:
          name: $(agentPool)
        variables:
          - group: kubapc-test-secrets
        steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: What-if against rg-kubapc-test
            inputs:
              azureSubscription: sc-kubapc-test
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                export JWT_SECRET='$(JWT_SECRET)'
                az deployment group what-if \
                  --resource-group rg-kubapc-test \
                  --template-file azure/infra/main.bicep \
                  --parameters azure/infra/test.bicepparam \
                  --result-format FullResourcePayloads
      - job: WhatIfProd
        displayName: Preview changes to prod
        dependsOn: Lint
        # A pull request must never touch the prod identity or the prod variable group.
        condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
        pool:
          name: $(agentPool)
        variables:
          - group: kubapc-prod-secrets
        steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: What-if against rg-kubapc-prod
            inputs:
              azureSubscription: sc-kubapc-prod
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                export JWT_SECRET='$(JWT_SECRET)'
                az deployment group what-if \
                  --resource-group rg-kubapc-prod \
                  --template-file azure/infra/main.bicep \
                  --parameters azure/infra/prod.bicepparam \
                  --result-format FullResourcePayloads

  - stage: Build
    displayName: Build and test the application
    dependsOn: Validate
    jobs:
      - job: BuildApp
        displayName: Restore, build, test and publish
        pool:
          name: $(agentPool)
        steps:
          - checkout: self
          # Installs the exact SDK named in global.json, the same one developers build
          # with. The agent's own SDK comes from Ubuntu's feed and lags behind; its
          # older Razor compiler rejects syntax the newer one accepts.
          - task: UseDotNet@2
            displayName: Install the .NET SDK from global.json
            inputs:
              packageType: sdk
              useGlobalJson: true
          - script: dotnet restore $(appSolution)
            displayName: Restore packages
          - script: dotnet build $(appSolution) --configuration Release --no-restore
            displayName: Build
          - script: dotnet test $(testProject) --configuration Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory $(Build.ArtifactStagingDirectory)/tests
            displayName: Unit tests
          - task: PublishTestResults@2
            displayName: Publish test results
            condition: always()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '$(Build.ArtifactStagingDirectory)/tests/*.trx'
          - script: |
              set -euo pipefail
              dotnet publish $(apiProject) --configuration Release --no-build --output $(Build.ArtifactStagingDirectory)/api
              cd $(Build.ArtifactStagingDirectory)/api
              zip -qr ../api.zip .
            displayName: Publish the API
          - script: |
              set -euo pipefail
              # No --no-build here: publishing is what writes the fingerprinted Blazor file
              # names into index.html, and skipping the build skips that step.
              dotnet publish $(adminProject) --configuration Release --output $(Build.ArtifactStagingDirectory)/admin
              cp azure/web/staticwebapp.config.json $(Build.ArtifactStagingDirectory)/admin/wwwroot/
            displayName: Publish the Admin client
          - script: |
              set -euo pipefail
              mkdir -p $(Build.ArtifactStagingDirectory)/sql
              cp $(sqlScripts)/*.sql $(Build.ArtifactStagingDirectory)/sql/
            displayName: Collect database scripts
          - publish: $(Build.ArtifactStagingDirectory)/api.zip
            artifact: api
          - publish: $(Build.ArtifactStagingDirectory)/admin/wwwroot
            artifact: admin
          - publish: $(Build.ArtifactStagingDirectory)/sql
            artifact: sql

  # Test flows through without approval. Its three stages are Test_Infrastructure,
  # Test_Database and Test_Application.
  - template: templates/deploy-environment.yml
    parameters:
      environmentName: test
      serviceConnection: sc-kubapc-test
      resourceGroup: rg-kubapc-test
      parameterFile: azure/infra/test.bicepparam
      variableGroup: kubapc-test-secrets
      dependsOn: Build

  # Prod only exists in the run when the box is ticked; each of its three
  # Azure DevOps environments carries an approval check.
  - ${{ if eq(parameters.deployProd, true) }}:
      - template: templates/deploy-environment.yml
        parameters:
          environmentName: prod
          serviceConnection: sc-kubapc-prod
          resourceGroup: rg-kubapc-prod
          parameterFile: azure/infra/prod.bicepparam
          variableGroup: kubapc-prod-secrets
          dependsOn: Test_Application
